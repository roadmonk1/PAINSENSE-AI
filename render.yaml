services:
  # FastAPI Backend Web Service
  - type: web
    name: painsense-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_DEMO_MODE
        value: "True"
      - key: CORS_ORIGINS
        value: "https://painsense-ai.vercel.app,http://localhost:5173"

  # Static Site Frontend
  - type: web
    name: painsense-ui
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://painsense-api.onrender.com/api
